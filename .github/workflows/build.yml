name: Build MCPE-103399 Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create MCPE-103399.mm
        run: |
          cat << 'EOF' > MCPE-103399.mm
          #import <Foundation/Foundation.h>
          #import <dlfcn.h>

          typedef int (*DobbyHookFn)(void *function_address, void *replace_call, void **origin_call);
          typedef void (*MSHookFunctionFn)(void *symbol, void *replace, void **result);

          // Указатели на оригинальные функции MCPE 1.1.5
          bool (*orig_SignItem_useOn)(void* self, void* itemStack, void* player, int x, int y, int z, signed char face, float clickX, float clickY, float clickZ);
          bool (*orig_BlockSource_setBlock)(void* blockSource, int x, int y, int z, void* block, int updateFlags);
          void* (*orig_BlockSource_getBlock)(void* blockSource, int x, int y, int z);
          void* (*orig_Player_getRegion)(void* player);
          int (*orig_Block_getId)(void* block);

          #define BEDROCK_ID 7

          // Хук на использование таблички
          bool hook_SignItem_useOn(void* self, void* itemStack, void* player, int x, int y, int z, signed char face, float clickX, float clickY, float clickZ) {
              if (player != NULL) {
                  // Получаем BlockSource (Region) игрока
                  void* region = NULL;
                  if (orig_Player_getRegion != NULL) {
                      region = orig_Player_getRegion(player);
                  }

                  if (region != NULL) {
                      // Вычисляем координаты блока, в который ставится табличка
                      int targetX = x;
                      int targetY = y;
                      int targetZ = z;

                      switch (face) {
                          case 0: targetY--; break; // Bottom
                          case 1: targetY++; break; // Top
                          case 2: targetZ--; break; // North
                          case 3: targetZ++; break; // South
                          case 4: targetX--; break; // West
                          case 5: targetX++; break; // East
                      }

                      // Проверяем текущий блок на целевых координатах
                      if (orig_BlockSource_getBlock != NULL && orig_Block_getId != NULL) {
                          void* currentBlock = orig_BlockSource_getBlock(region, targetX, targetY, targetZ);
                          if (currentBlock != NULL) {
                              int blockId = orig_Block_getId(currentBlock);
                              
                              // Если это НЕ бедрок и НЕ воздух (id 0) - форсированно стираем его (ставим воздух перед ставкой таблички)
                              if (blockId != BEDROCK_ID && blockId != 0 && orig_BlockSource_setBlock != NULL) {
                                  // Ставим воздух (NULL/0) по целевым координатам, "съедая" блок
                                  orig_BlockSource_setBlock(region, targetX, targetY, targetZ, NULL, 3);
                              }
                          }
                      }
                  }
              }

              // Вызываем оригинальный SignItem::useOn, который теперь легко поставит табличку в очищенное место
              return orig_SignItem_useOn(self, itemStack, player, x, y, z, face, clickX, clickY, clickZ);
          }

          bool install_hook(void* target, void* replace, void** origin) {
              if (!target) return false;

              DobbyHookFn dobby = (DobbyHookFn)dlsym(RTLD_DEFAULT, "DobbyHook");
              if (dobby) {
                  dobby(target, replace, origin);
                  return true;
              }

              MSHookFunctionFn substrate = (MSHookFunctionFn)dlsym(RTLD_DEFAULT, "MSHookFunction");
              if (substrate) {
                  substrate(target, replace, origin);
                  return true;
              }

              return false;
          }

          __attribute__((constructor))
          static void init_mcpe103399_patch() {
              // Символы MCPE 1.1.5
              void* signUseOnSym  = dlsym(RTLD_DEFAULT, "__NK8SignItem5useOnER9ItemStackR6PlayeriiiEfff");
              void* setBlockSym   = dlsym(RTLD_DEFAULT, "__ZN11BlockSource8setBlockEiiiRK5Blocki");
              void* getBlockSym   = dlsym(RTLD_DEFAULT, "__NK11BlockSource8getBlockEiii");
              void* getRegionSym  = dlsym(RTLD_DEFAULT, "__NK6Player9getRegionEv");
              void* getIdSym      = dlsym(RTLD_DEFAULT, "__NK5Block5getIdEv");

              if (setBlockSym) orig_BlockSource_setBlock = (bool (*)(void*, int, int, int, void*, int))setBlockSym;
              if (getBlockSym) orig_BlockSource_getBlock = (void* (*)(void*, int, int, int))getBlockSym;
              if (getRegionSym) orig_Player_getRegion = (void* (*)(void*))getRegionSym;
              if (getIdSym) orig_Block_getId = (int (*)(void*))getIdSym;

              if (signUseOnSym) {
                  install_hook(signUseOnSym, (void*)&hook_SignItem_useOn, (void**)&orig_SignItem_useOn);
              }
          }
          EOF

      - name: Compile Dylib
        run: |
          xcrun -sdk iphoneos clang++ -dynamiclib -Wall \
          -arch arm64 \
          -std=c++14 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation \
          MCPE-103399.mm -o MCPE-103399.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCPE-103399-dylib
          path: MCPE-103399.dylib
